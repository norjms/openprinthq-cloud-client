# OpenPrintHQ Cloud Client - continuous integration.
#
# Fast feedback on every push and pull request. The full installer matrix only
# runs on a version tag (see release.yml); this keeps the app compiling and the
# connector image building.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Tauri app compiles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            pkg-config libsoup-3.0-dev

      # Tauri's build script validates every externalBin path before it will
      # compile anything, so a check build needs all three sidecars present even
      # though it never runs them. Miss one and cargo check fails on a resource
      # path rather than on any Rust, which reads like a broken toolchain.
      - name: Fetch bundled Node sidecar
        run: bash scripts/fetch-node.sh x86_64-unknown-linux-gnu app/src-tauri/binaries

      - name: Fetch camera sidecars (go2rtc + ffmpeg)
        run: bash scripts/fetch-camera-tools.sh x86_64-unknown-linux-gnu app/src-tauri/binaries

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: app/src-tauri
        continue-on-error: true
        run: cargo clippy --all-targets

  agent:
    name: Connector agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check agent and scripts
        run: |
          set -euo pipefail
          find agent scripts \( -name '*.mjs' -o -name '*.js' \) -print0 \
            | xargs -0 -r -n1 node --check

      - name: Build connector image
        run: docker build -t openprinthq/connector:ci agent

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck --severity=error
