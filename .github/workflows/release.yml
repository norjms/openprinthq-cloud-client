# OpenPrintHQ Cloud Client - release on a version tag.
#
# Builds every installer on GitHub-hosted runners (free and unlimited for
# public repositories), publishes the GitHub Release and attaches all assets.
#
#   git tag v0.0.8 && git push origin v0.0.8
#
# macOS is built natively on an Apple-Silicon runner as a universal binary,
# so no local Mac has to be awake to cut a release.
name: release

on:
  # Automatic release on tag push is off: installers are built locally, and an
  # Actions run triggered by the same tag competes to publish the same release,
  # so whichever finishes second fails or overwrites assets. Dispatch it with a
  # version when you want Actions to do the build instead.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.0.8)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

  windows:
    name: Windows (.msi)
    needs: version
    runs-on: windows-latest
    # Which signing provider is configured, resolved once. This has to live at
    # job level: GitHub does not expose the `secrets` context to a step-level
    # `if:`, only to a job-level `env:`. A step `if:` that reads `secrets` is not
    # a step that gets skipped, it is a workflow that will not parse at all, and
    # it fails with no jobs and no error you can read from the run page.
    env:
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          jq --arg v "${{ needs.version.outputs.version }}" '.version=$v' \
            app/src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp app/src-tauri/tauri.conf.json
          grep '"version"' app/src-tauri/tauri.conf.json


      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Fetch bundled Node sidecar
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-node.ps1 -Triple x86_64-pc-windows-msvc -OutDir app/src-tauri/binaries

      - name: Fetch camera sidecars (go2rtc + ffmpeg)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-camera-tools.ps1 -Triple x86_64-pc-windows-msvc -OutDir app/src-tauri/binaries

      - name: Build MSI
        working-directory: app
        run: cargo tauri build --bundles msi

      # Signing.
      #
      # The provider is selected by which secrets exist, so changing provider is
      # a settings change rather than a code change, and a repository with
      # neither configured still produces a release.
      #
      # There is deliberately NO self-signed fallback here any more. A
      # self-signed Authenticode signature does not chain to a trusted root, so
      # Windows treats the binary exactly as it treats an unsigned one, while
      # WDAC and AppLocker publisher rules cannot match it and some scanners
      # score an invalid signature above a missing one. Its only real effect was
      # a reassuring line in this log. docs/CODE-SIGNING.md states the current
      # position in the open instead.

      - name: Sign MSI (Azure Artifact Signing)
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: app/src-tauri/target/release/bundle/msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # SignPath signs a file that GitHub is already holding, so the unsigned
      # MSI has to be uploaded as a workflow artifact first and the signed one
      # comes back into the same folder.
      - name: Stage unsigned MSI for SignPath
        if: env.HAS_SIGNPATH == 'true' && env.HAS_AZURE_SIGNING != 'true'
        id: unsigned-msi
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Sign MSI (SignPath Foundation)
        if: env.HAS_SIGNPATH == 'true' && env.HAS_AZURE_SIGNING != 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: app/src-tauri/target/release/bundle/msi

      # Say plainly what the user is about to be handed. An unsigned installer
      # is an acceptable state; an unsigned installer nobody noticed is not.
      - name: Report signing state
        shell: pwsh
        run: |
          $msi = Get-ChildItem app/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI produced" }
          $sig = Get-AuthenticodeSignature $msi.FullName
          Write-Host "MSI:    $($msi.Name)"
          Write-Host "Status: $($sig.Status)"
          if ($sig.Status -eq 'Valid') {
            Write-Host "Signer: $($sig.SignerCertificate.Subject)"
            Write-Host "Thumb:  $($sig.SignerCertificate.Thumbprint)"
          } elseif ($sig.Status -eq 'NotSigned') {
            Write-Host "::warning::Shipping an UNSIGNED MSI. No signing provider is configured. See docs/CODE-SIGNING.md."
          } else {
            # Anything that is neither valid nor absent means a signature was
            # applied and does not verify, which is the state this workflow
            # exists to never be in again.
            throw "MSI carries a signature that does not verify ($($sig.Status)). Refusing to publish it."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    name: macOS (.pkg, universal)
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          jq --arg v "${{ needs.version.outputs.version }}" '.version=$v' \
            app/src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp app/src-tauri/tauri.conf.json
          grep '"version"' app/src-tauri/tauri.conf.json


      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build .app and assemble .pkg
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: universal-apple-darwin
        run: ./scripts/build-macos.sh

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          cp OpenPrintHQ-Cloud-Client-*-macos.pkg dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.pkg
          if-no-files-found: error

  linux:
    name: Linux (.deb / .rpm)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          jq --arg v "${{ needs.version.outputs.version }}" '.version=$v' \
            app/src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp app/src-tauri/tauri.conf.json
          grep '"version"' app/src-tauri/tauri.conf.json


      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev \
            pkg-config libsoup-3.0-dev rpm

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Fetch bundled Node sidecar
        run: bash scripts/fetch-node.sh x86_64-unknown-linux-gnu app/src-tauri/binaries

      - name: Fetch camera sidecars (go2rtc + ffmpeg)
        run: bash scripts/fetch-camera-tools.sh x86_64-unknown-linux-gnu app/src-tauri/binaries

      - name: Build deb + rpm
        working-directory: app
        run: cargo tauri build --bundles deb,rpm

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  docker:
    name: Connector image (GHCR, multi-arch)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openprinthq-connector:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/openprinthq-connector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Kept for continuity: the web app's Docker instructions still offer a
      # loadable tarball. Remove once those point at GHCR.
      - name: Export amd64 tarball asset
        run: |
          set -euo pipefail
          mkdir -p dist
          docker buildx build --platform linux/amd64 --load \
            -t openprinthq/connector:${{ needs.version.outputs.version }} agent
          docker save openprinthq/connector:${{ needs.version.outputs.version }} \
            | gzip > dist/openprinthq-connector-docker.tar.gz
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-docker
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, windows, macos, linux, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: dist-*
          merge-multiple: true

      - name: List assets
        run: ls -la assets

      # Until certificate signing is in place, a published checksum is the only
      # thing a user can check a download against, so it has to be an asset of
      # the release rather than a number in a log.
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          # Every asset name here contains spaces ("OpenPrintHQ Cloud
          # Client_0.0.20_x64_en-US.msi"), so the filenames have to reach
          # sha256sum without passing through word splitting. Hence -print0 and
          # xargs -0 rather than a glob or a list substituted into a command
          # line. SHA256SUMS.txt is excluded by name so a re-run cannot checksum
          # the previous run's output.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OpenPrintHQ Cloud Client ${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: assets/*
          body: |
            OpenPrintHQ Cloud Client ${{ needs.version.outputs.version }}

            **Installers**
            - Windows: `.msi`
            - macOS: `.pkg` (universal - Apple Silicon and Intel)
            - Linux: `.deb` / `.rpm`

            **Docker**

                docker pull ghcr.io/${{ github.repository_owner }}/openprinthq-connector:${{ needs.version.outputs.version }}

            A loadable image tarball is also attached.

            **Verifying your download**

            `SHA256SUMS.txt` is attached. Compare it against your download
            before installing:

                # Windows
                Get-FileHash .\OpenPrintHQ.Cloud.Client_${{ needs.version.outputs.version }}_x64_en-US.msi -Algorithm SHA256

                # macOS / Linux
                shasum -a 256 <file>

            See `docs/CODE-SIGNING.md` for what is and is not signed, and why.
