# OpenPrintHQ local connector — Docker Compose
# 1) cp .env.example .env  and fill in OPHQ_CONTROL_URL + OPHQ_CONNECTOR_TOKEN
# 2) docker compose up -d
#
# network_mode: host lets the connector reach printers on your LAN by their
# real IPs. On Docker Desktop (macOS/Windows) host networking is limited — use
# the default bridge and set OPHQ_ALLOW to the specific printer IPs instead.
services:
  connector:
    build: .
    image: openprinthq/connector:latest
    container_name: openprinthq-connector
    restart: unless-stopped
    env_file: .env
    network_mode: host
    environment:
      # Persist the connector's own key on the volume below so trust-on-first-use
      # pairing survives container recreates (without this the key regenerates
      # and your instance rejects it until you Reset the connector).
      OPHQ_CLIENT_KEY_FILE: /data/connector-key.pem
      # Where the control-plane's command-signing key is pinned on first run.
      # On the same volume so the pin survives container recreates.
      OPHQ_SIGNING_PUBKEY_FILE: /data/ophq-signing.pub.pem
    volumes:
      - ./data:/data
