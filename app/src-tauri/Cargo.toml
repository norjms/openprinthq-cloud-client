[package]
name = "openprinthq-cloud-client"
version = "0.0.9"
description = "OpenPrintHQ Cloud Client — tray/menu-bar app that supervises the local connector"
authors = ["James Norman <norjms@gmail.com>"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openprinthq_cloud_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
ureq = { version = "2", features = ["json"] }

[features]
# This feature is used for production builds where `devUrl` is not needed.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
